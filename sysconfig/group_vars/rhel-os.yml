---
# Browser and install
chrome_cis_browser: chromium # chrome or chromium
chrome_cis_install: true # false = harden an existing install only
chrome_cis_channel: stable # Chrome only: stable, beta, unstable, canary
chrome_cis_version: "" # "" = newest; e.g. "143.0.7499.40" (oldest Chrome on Google's server)
  # Chromium: needs EPEL enabled on the host first

# Profiles
chrome_cis_level_1: true
chrome_cis_level_2: true

# Sections (false = skip the whole section)
# chrome_cis_section1: false                   # Enforced Defaults
# chrome_cis_section2: false                   # Attack Surface Reduction
# chrome_cis_section3: false                   # Privacy
# chrome_cis_section4: false                   # Data Loss Prevention
# chrome_cis_section5: false                   # Forensics

# Exceptions: risky CIS rules this site does not apply
chrome_cis_rule_4_7: false # DNS-over-HTTPS only: no DoH server in the lab
# chrome_cis_rule_2_2_3: false                 # WebUSB blocked
# chrome_cis_rule_2_3_3: false                 # removes every extension
# chrome_cis_rule_2_4_1: false                 # Basic/Digest login stops
# chrome_cis_rule_2_5_1: false                 # extensions can't talk to local apps
# chrome_cis_rule_2_12: false                  # no click-through on cert errors
# chrome_cis_rule_2_18: false                  # local CA certs fail if OCSP/CRL is down
# chrome_cis_rule_3_1_1: false                 # logged out when Chrome closes
# chrome_cis_rule_4_1_1: false                 # no screen sharing (also 4.12)
# chrome_cis_rule_4_3: false                   # no upload / save as
# chrome_cis_rule_4_4: false                   # no microphone
# chrome_cis_rule_4_5: false                   # no camera

# Not applicable on Chrome 155 (on bour version/browser doesn't supportthem
# Removed from Chrome
chrome_cis_rule_1_10: false # CertificateTransparencyEnforcementDisabledForLegacyCas
chrome_cis_rule_1_19: false
chrome_cis_rule_2_3_4: false                 # DefaultThirdPartyStoragePartitioningSetting (L2)
chrome_cis_rule_2_3_5: false
chrome_cis_rule_2_3_6: false                 # ExtensionManifestV2Availability (L2)
chrome_cis_rule_2_7_1: false
chrome_cis_rule_2_9_1: false                 # FirstPartySetsEnabled
chrome_cis_rule_2_23: false                  # EnforceLocalAnchorConstraintsEnabled (L2)
chrome_cis_rule_2_29: false
chrome_cis_rule_3_6: false                   # ChromeCleanupReportingEnabled
# Windows only
chrome_cis_rule_2_8_2: false                 # RemoteAccessHostAllowUiAccessForRemoteAssistance
chrome_cis_rule_2_10_1: false                # CloudAPAuthEnabled
chrome_cis_rule_2_30: false
chrome_cis_rule_3_13: false                  # SafeBrowsingForTrustedSourcesEnabled

# Site values: CIS lets the organization decide (lab demo values)
chrome_cis_safe_browsing_protection: 1 # 1.2.2: 1 or 2
chrome_cis_variations: 0 # 1.9
chrome_cis_password_manager_enabled: # 2.6.1
chrome_cis_remote_access_connections: false # 2.8.1
chrome_cis_remote_access_client_domains: ["lab.example.com"] # 2.8.3
chrome_cis_proxy_mode: direct # 2.17: direct or system
chrome_cis_http_allowlist: ["intranet.lab.example.com"] # 2.27
chrome_cis_clipboard_allowed_urls: ["https://app.lab.example.com"] # 4.2.3
chrome_cis_clipboard_blocked_urls: ["[*.]example.org"] # 4.2.4
chrome_cis_window_management_allowed_urls: ["https://app.lab.example.com"] # 4.2.7 (L2)
chrome_cis_window_management_blocked_urls: ["[*.]example.org"] # 4.2.8 (L2)           # 4.2.8 (L2)
# chrome_cis_extension_allowlist: ["<extension id>"]                        # 2.3.3
# chrome_cis_native_messaging_allowl           # 2.5.1
# chrome_cis_third_party_storage_blocked_origins: ["https://example.com"]   # 2.3.5 (N/A rule)
